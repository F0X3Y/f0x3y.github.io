<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="The candidates competing for the title of my 2000th favorite song."
    >
        

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div id="background"></div>

    <div id="background-overlay"></div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>

        <header class="hero">

            <div class="hero-content">

                <span class="eyebrow">
                    THE 2000TH
                </span>

                <div class="text">
                    MY 2000TH SONG<br>
                    MY 2000TH SONG<br>
                    MY 2000TH SONG<br>
                    MY 2000TH SONG<br>
                </div>

                <p style="font-size: 20px;font-weight:150;">
                    The candidates competing for the spot.
                </p>

            </div>

        </header>


        <!-- =================================================
             MUSIC CARDS
        ================================================== -->

        <section class="music-container">

            <div
                id="music-list"
                aria-label="Song candidates"
            ></div>

        </section>


        <!-- =================================================
             SCROLL HINT
        ================================================== -->

        <div class="scroll-hint">

            <span>
                Scroll to explore
            </span>

            <span class="scroll-arrow">
                →
            </span>

        </div>

    </main>


    <!-- =====================================================
         DEFAULT BACKGROUND MUSIC
    ====================================================== -->

    <audio
        id="background-music"
        src="musics/background.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- =====================================================
         SCRIPT
    ====================================================== -->

    <script src="script.js"></script>

</body>

</html>
