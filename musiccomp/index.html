<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="The candidates competing for the title of my 2000th favorite song."
    >

    <title>My 2000th Song</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         LOADING SCREEN
    ====================================================== -->

    <div id="loader">

        <div class="loader-content">

            <div class="loader-spinner"></div>

            <div class="loader-text">
                LOADING...
            </div>

        </div>

    </div>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div id="background"></div>

    <div id="background-overlay"></div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             HERO
        ================================================== -->

        <header class="hero">

            <div class="hero-content">

                <span class="eyebrow">
                    THE 2000TH
                </span>

                <div class="text">

                    MY 2000TH SONG<br>
                    MY 2000TH SONG<br>
                    MY 2000TH SONG<br>
                    MY 2000TH SONG

                </div>

                <p>
                    The candidates competing for the spot.
                </p>

            </div>

        </header>


        <!-- =================================================
             MUSIC CARDS
        ================================================== -->

        <section class="music-container">

            <div
                id="music-list"
                aria-label="Song candidates"
            ></div>

        </section>


        <!-- =================================================
             SCROLL HINT
        ================================================== -->

        <div class="scroll-hint">

            <span>
                Scroll to explore
            </span>

            <span class="scroll-arrow">
                →
            </span>

        </div>

    </main>


    <!-- =====================================================
         MUSIC PLAYER
    ====================================================== -->

    <button
        id="music-player"
        class="music-player"
        type="button"
        aria-label="Play background music"
    >

        <div class="player-icon">

            <img
                id="player-gif"
                src="musics/play-pause.gif"
                alt=""
            >

        </div>


        <div
            id="visualizer"
            class="visualizer"
            aria-hidden="true"
        >

            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

    </button>


    <!-- =====================================================
         BACKGROUND MUSIC
    ====================================================== -->

    <audio
        id="background-music"
        src="musics/background.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- =====================================================
         SCRIPT
    ====================================================== -->

    <script src="script.js"></script>

</body>

</html>
