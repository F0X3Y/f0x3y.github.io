<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="The candidates competing for the title of my 2000th favorite song."
    >

    <title>My 2000th Song</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         LIQUID GLASS FILTER
    ====================================================== -->

    <svg
        width="0"
        height="0"
        style="
            position: absolute;
            pointer-events: none;
            overflow: hidden;
        "
        aria-hidden="true"
    >

        <filter
            id="liquidGlass"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
        >

            <feTurbulence
                type="turbulence"
                baseFrequency="0.01"
                numOctaves="2"
                result="turbulence"
            />

            <feDisplacementMap
                in="SourceGraphic"
                in2="turbulence"
                scale="200"
                xChannelSelector="R"
                yChannelSelector="G"
            />

        </filter>

    </svg>


    <!-- =====================================================
         LOADING SCREEN
    ====================================================== -->

    <div id="loader">

        <div class="loader-content">

            <div class="loader-spinner"></div>

            <div class="loader-text">
                LOADING...
            </div>

        </div>

    </div>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div id="background"></div>

    <div id="background-overlay"></div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             HERO
        ================================================== -->

        <header class="hero">

            <div class="hero-content">

                <span class="eyebrow">
                    THE 2000TH
                </span>


                <div class="text">

                    <svg
                        class="glass-title"
                        viewBox="0 0 1200 120"
                        preserveAspectRatio="xMidYMid meet"
                        aria-label="MY 2000TH SONG"
                        role="img"
                    >

                        <defs>

                            <filter
                                id="titleGlass"
                                x="-10%"
                                y="-20%"
                                width="120%"
                                height="140%"
                            >

                                <feGaussianBlur
                                    in="SourceGraphic"
                                    stdDeviation="0.6"
                                    result="blur"
                                />

                                <feSpecularLighting
                                    in="blur"
                                    surfaceScale="3"
                                    specularConstant="0.5"
                                    specularExponent="18"
                                    lighting-color="white"
                                    result="specular"
                                >

                                    <feDistantLight
                                        azimuth="225"
                                        elevation="55"
                                    />

                                </feSpecularLighting>

                                <feComposite
                                    in="specular"
                                    in2="SourceGraphic"
                                    operator="in"
                                    result="highlight"
                                />

                                <feMerge>

                                    <feMergeNode
                                        in="SourceGraphic"
                                    />

                                    <feMergeNode
                                        in="highlight"
                                    />

                                </feMerge>

                            </filter>


                            <linearGradient
                                id="titleGlassFill"
                                x1="0"
                                y1="0"
                                x2="0"
                                y2="1"
                            >

                                <stop
                                    offset="0%"
                                    stop-color="white"
                                    stop-opacity="0.34"
                                />

                                <stop
                                    offset="28%"
                                    stop-color="white"
                                    stop-opacity="0.13"
                                />

                                <stop
                                    offset="55%"
                                    stop-color="white"
                                    stop-opacity="0.055"
                                />

                                <stop
                                    offset="100%"
                                    stop-color="white"
                                    stop-opacity="0.18"
                                />

                            </linearGradient>


                            <linearGradient
                                id="titleGlassStroke"
                                x1="0"
                                y1="0"
                                x2="0"
                                y2="1"
                            >

                                <stop
                                    offset="0%"
                                    stop-color="white"
                                    stop-opacity="0.80"
                                />

                                <stop
                                    offset="35%"
                                    stop-color="white"
                                    stop-opacity="0.42"
                                />

                                <stop
                                    offset="100%"
                                    stop-color="white"
                                    stop-opacity="0.58"
                                />

                            </linearGradient>

                        </defs>


                        <text
                            x="600"
                            y="86"
                            text-anchor="middle"
                            class="glass-title-base"
                        >
                            MY 2000TH SONG
                        </text>


                        <text
                            x="600"
                            y="86"
                            text-anchor="middle"
                            class="glass-title-surface"
                        >
                            MY 2000TH SONG
                        </text>


                        <text
                            x="600"
                            y="86"
                            text-anchor="middle"
                            class="glass-title-border"
                        >
                            MY 2000TH SONG
                        </text>


                        <text
                            x="600"
                            y="86"
                            text-anchor="middle"
                            class="glass-title-highlight"
                        >
                            MY 2000TH SONG
                        </text>

                    </svg>

                </div>


                <p>
                    The candidates competing for the spot.
                </p>

            </div>

        </header>


        <!-- =================================================
             MUSIC CARDS
        ================================================== -->

        <section class="music-container">

            <div
                id="music-list"
                aria-label="Song candidates"
            ></div>

        </section>


        <!-- =================================================
             SCROLL HINT
        ================================================== -->

        <div class="scroll-hint">

            <span>
                Scroll to explore
            </span>

            <span class="scroll-arrow">
                →
            </span>

        </div>

    </main>


    <!-- =====================================================
         MUSIC PLAYER
    ====================================================== -->

    <button
        id="music-player"
        class="music-player"
        type="button"
        aria-label="Play background music"
    >

        <div class="player-icon">

            <img
                id="player-gif"
                src="musics/play.jpg"
                alt=""
            >

        </div>


        <div
            id="visualizer"
            class="visualizer"
            aria-hidden="true"
        >

            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

    </button>


    <!-- =====================================================
         BACKGROUND MUSIC
    ====================================================== -->

    <audio
        id="background-music"
        src="musics/background.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- =====================================================
         YOUTUBE PLAYER
    ====================================================== -->

    <div
        id="youtube-preview-wrapper"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         YOUTUBE IFRAME API
    ====================================================== -->

    <script src="https://www.youtube.com/iframe_api"></script>

    <script src="script.js"></script>

</body>

</html>
