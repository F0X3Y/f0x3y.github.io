<main>


<section class="submit-box">


    <h1>🎥 Clip beküldése</h1>



    <div id="drop-zone">


        <p>
            🎬 Húzd ide a clip-eket
        </p>


        <span>
            vagy kattints a tallózáshoz
        </span>



        <input 
            id="file-input"
            type="file"
            accept="video/*"
            multiple
        >


    </div>





    <div id="clip-container"></div>





    <button type="submit">

        Beküldés

    </button>



</section>
