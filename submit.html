<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clip beküldése - Clip Nézegetés</title>

    <link rel="icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">

</head>


<body>

<div id="page-transition"></div>

<nav>

    <h2>🎬 ClipNézegetés</h2>

    <div class="nav-actions">

        <div class="server-status-nav" data-server-status="nav" aria-live="polite">
            <span class="server-status-dot"></span>
            <span class="server-status-text">A szerver ellenőrzése...</span>
        </div>

        <a href="index.html">Home</a>

        <a href="submit.html">Beküldés</a>

        <a href="clips.html">Böngészés</a>

        <a href="profile.html">Profil</a>

    </div>

</nav>




<main>


<section class="submit-box">


    <h1>🎥 Clip beküldése</h1>



    <div id="drop-zone">


        <p>
            🎬 Húzd ide a clip-eket
        </p>


        <span>
            vagy kattints a tallózáshoz
        </span>



        <input 
            id="file-input"
            type="file"
            accept="video/*"
            multiple
        >


    </div>





    <div id="clip-container"></div>



    <div class="submit-controls">
        <div id="upload-progress-wrapper" class="upload-progress-wrapper hidden" aria-live="polite">
            <div id="upload-progress-bar" class="upload-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span id="upload-progress-text">Feltöltés...</span>
            </div>
        </div>
        <div id="upload-status" class="upload-status" aria-live="polite"></div>

        <div class="submit-actions-row">
            <button type="submit">
                Beküldés
            </button>

            <div class="server-status-panel" data-server-status="submit" aria-live="polite">
                <div class="server-status-main">
                    <span class="server-status-dot"></span>
                    <span class="server-status-text">A szerver ellenőrzése...</span>
                </div>
                <button type="button" class="server-status-refresh" id="server-status-refresh" aria-label="Szerver állapot frissítése">
                    ↻ Frissítés
                </button>
            </div>
        </div>
    </div>



</section>


</main>


<!--  -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
<script src="backend_comms.js"></script>
<script src="script.js"></script>


</body>

</html>
