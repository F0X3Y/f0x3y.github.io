name: Discord Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | while read file; do
            echo "📄 [$file](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/$file)"
          done)

          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Discord message
        run: |
          MESSAGE=$(cat <<'EOF'
          || <@&1534146629555327027> ||

          🚀 Új frissítés érkezett a GitHub repóba!

          📦 Repository: ${{ github.repository }}
          👤 Készítette: ${{ github.actor }}

          📝 Commit: [${{ github.event.head_commit.message }}](${{ github.event.head_commit.url }})

          🔗 Weblap: [f0x3y.github.io](https://f0x3y.github.io)

          📂 Módosított fájlok:
          ${{ steps.changed.outputs.files }}
          EOF
          )

          jq -n \
          --arg content "$MESSAGE" \
          '{content: $content}' \
          | curl \
          -H "Content-Type: application/json" \
          -X POST \
          -d @- \
          ${{ secrets.DISCORD_WEBHOOK }}