name: Discord Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "content": "🚀 Új frissítés érkezett a GitHub repóba!\n📦 Repository: ${{ github.repository }}\n👤 Készítette: ${{ github.actor }}\n📝 Commit: ${{ github.event.head_commit.message }}\n🔗 ${{ github.event.head_commit.url }}"
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}
