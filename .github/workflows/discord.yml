name: Discord Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch full history so diffs comparing SHAs always work
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          echo "files<<EOF" >> $GITHUB_OUTPUT

          # If this is the first push (created branch), github.event.before is all zeros.
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # list all tracked files in the repo
            git ls-files | while read -r file; do
              [ -n "$file" ] && echo "📄 [$file](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/$file)" >> $GITHUB_OUTPUT
            done
          else
            # Compare the previous SHA to the current SHA from the event to avoid fragile HEAD~1
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | while read -r file; do
              [ -n "$file" ] && echo "📄 [$file](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/$file)" >> $GITHUB_OUTPUT
            done
          fi

          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Discord message
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "ERROR: DISCORD_WEBHOOK secret is not set"
            exit 1
          fi

          # Build JSON safely using Python so content is properly escaped for JSON
          payload=$(python3 - <<PY
import json, os
content = (
    "|| <@&1534146629555327027> ||\n\n"
    "🚀 Új frissítés érkezett a GitHub repóba!\n\n"
    f"📦 Repository: {os.environ.get('GITHUB_REPOSITORY')}\n"
    f"👤 Készítette: {os.environ.get('GITHUB_ACTOR')}\n\n"
    + os.environ.get('FILES','')
)
print(json.dumps({"content": content}))
PY
)

          # Send request and fail the step if Discord returns non-success
          echo "Sending Discord webhook..."
          curl -sS --fail -H "Content-Type: application/json" -X POST -d "$payload" "$WEBHOOK"
